name: Import Katameros

on:
  workflow_dispatch: {}      # start it by hand: Actions tab ▸ Import Katameros ▸ Run workflow

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --omit=dev --no-audit --no-fund
      - run: node import-katameros.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
