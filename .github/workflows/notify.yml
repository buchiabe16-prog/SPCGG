name: Send notifications

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub may run it a few minutes late)
  workflow_dispatch: {}      # lets you start it by hand: Actions tab ▸ Run workflow

concurrency:
  group: notify
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --omit=dev --no-audit --no-fund
      - run: node run.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
